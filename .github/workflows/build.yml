name: Build CloudStream extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: write

concurrency:
  group: "bhoom-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build plugins
        working-directory: src
        run: |
          gradle make makePluginsJson

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Check build freshness
        id: freshness
        run: |
          SOURCE_SHA=$(git -C src rev-parse HEAD)
          LATEST_MAIN_SHA=$(git ls-remote https://github.com/adarsh7665-dev/BhoomTVProvider.git refs/heads/main | cut -f1)

          if [ "$SOURCE_SHA" != "$LATEST_MAIN_SHA" ]; then
            echo "This build is stale ($SOURCE_SHA); latest main is $LATEST_MAIN_SHA. Skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Build is current ($SOURCE_SHA)."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish generated files
        if: steps.freshness.outputs.publish == 'true'
        run: |
          find builds -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp src/repo.json builds/repo.json
          cp src/BhoomTV/build/*.cs3 builds/
          cp src/build/plugins.json builds/plugins.json

          cd builds
          git config user.name "adarsh7665-dev"
          git config user.email "adarsh7665-dev@users.noreply.github.com"
          git add -A
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push origin builds
